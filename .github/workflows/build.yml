name: Build and Test

on:
  push:
    branches:
      - develop
      - feature/*
      - hotfix/*
      - release/*
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'

    - name: Install git-flow-version tool
      run: dotnet tool install --global --prerelease git-flow-version

    - name: Install coverlet
      run: dotnet tool install --global coverlet.console

    - name: Restore dependencies
      run: dotnet restore

    - name: Run tests with coverage
      run: dotnet test /p:CollectCoverage=true /p:Exclude="[xunit.*]*" /p:CoverletOutput='../../built/DashDashVersion.xml' /p:CoverletOutputFormat=cobertura

    - name: Create built folder
      run: mkdir -p built

    - name: Calculate version
      if: github.event_name == 'push' && !contains(github.ref, '/merge')
      shell: pwsh
      run: |
        $version = git-flow-version --branch=${{ github.ref_name }} | ConvertFrom-Json
        Write-Host "calculated version:"
        $version | Format-List
        echo "SEMVER=$($version.SemVer)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "FULLSEMVER=$($version.FullSemVer)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "ASSEMBLYVERSION=$($version.AssemblyVersion)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Create assembly info
      if: github.event_name == 'push' && !contains(github.ref, '/merge')
      shell: pwsh
      run: |
        $assemblyInfoContent = @"
        // <auto-generated/>
        using System.Reflection;
        using System.Runtime.InteropServices;

        [assembly: AssemblyVersionAttribute("${{ env.ASSEMBLYVERSION }}")]
        [assembly: AssemblyFileVersionAttribute("${{ env.ASSEMBLYVERSION }}")]
        [assembly: AssemblyInformationalVersionAttribute("${{ env.FULLSEMVER }}")]
        "@
        New-Item -ItemType Directory "built" -Force | Out-Null
        $assemblyInfoContent | Out-File -Encoding utf8 "built/SharedAssemblyInfo.cs" -Force

    - name: Create NuGet packages
      if: github.event_name == 'push' && !contains(github.ref, '/merge')
      run: |
        dotnet pack ./src/DashDashVersion/DashDashVersion.csproj --output ./built --configuration Release /p:Version=${{ env.FULLSEMVER }}
        dotnet pack ./src/git-flow-version/git-flow-version.csproj --output ./built --configuration Release /p:Version=${{ env.FULLSEMVER }}

    - name: Tag release
      if: github.event_name == 'push' && !contains(github.ref, '/merge') && github.ref != 'refs/heads/develop'
      run: |
        git config --global user.email "github-actions@noreply.github.com"
        git config --global user.name "github-actions"
        if ! git rev-parse "refs/tags/${{ env.SEMVER }}" >/dev/null 2>&1; then
          git tag ${{ env.SEMVER }}
          git push origin ${{ env.SEMVER }}
        fi

    - name: Publish to NuGet
      if: github.event_name == 'push' && !contains(github.ref, '/feature/') && !contains(github.ref, '/merge')
      run: |
        dotnet nuget push ./built/*.nupkg --api-key ${{ secrets.NUGET_APIKEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
